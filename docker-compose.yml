# Optional: real PostgreSQL + MongoDB (the app falls back to SQLite + a JSONL file without them)
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: aac, POSTGRES_PASSWORD: aac_pass, POSTGRES_DB: aac }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]
volumes: { pgdata: {}, mongodata: {} }
